server:
  port: 8080

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: user-service-api
              uri: http://user-service:8080
              predicates:
                - Path=/api/users/**
            - id: user-service-auth
              uri: http://user-service:8080
              predicates:
                - Path=/api/auth/**
            - id: product-service
              uri: http://product-service:8080
              predicates:
                - Path=/api/products/**
            - id: order-service
              uri: http://order-service:8080
              predicates:
                - Path=/api/orders/**
            - id: shipping-service
              uri: http://shipping-service:8080
              predicates:
                - Path=/api/shipments/**
            - id: billing-service
              uri: http://billing-service:8080
              predicates:
                - Path=/api/transactions/**


