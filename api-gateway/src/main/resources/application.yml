server:
  port: 8085

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      routes:
        - id: user-service
          uri: http://user-service:8080
          predicates:
            - Path=/api/users/**, /api/auth/**
        - id: order-service
          uri: http://order-service:8080
          predicates:
            - Path=/api/orders/**
