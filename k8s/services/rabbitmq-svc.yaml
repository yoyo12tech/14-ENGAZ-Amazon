apiVersion: v1
kind: Service
metadata:
  name: rabbitmq
  namespace: amazon
spec:
  selector:
    app: rabbitmq
  # ClusterIP so services inside the cluster reach rabbitmq:5672
  # and rabbitmq:15672 (management UI, useful for kubectl port-forward during demos)
  type: ClusterIP
  ports:
    - name: amqp
      port: 5672
      targetPort: 5672
    - name: management
      port: 15672
      targetPort: 15672
