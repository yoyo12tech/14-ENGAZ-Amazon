apiVersion: v1
kind: Service
metadata:
  name: elasticsearch
  namespace: amazon
spec:
  selector:
    app: elasticsearch
  # Headless so the StatefulSet pod gets a stable DNS entry:
  # elasticsearch-0.elasticsearch.amazon.svc.cluster.local
  # Spring Boot services connect via the short name: elasticsearch:9200
  clusterIP: None
  ports:
    - name: http
      port: 9200
      targetPort: 9200
    - name: transport
      port: 9300
      targetPort: 9300