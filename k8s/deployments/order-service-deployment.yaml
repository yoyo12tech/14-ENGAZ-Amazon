apiVersion: apps/v1
kind: Deployment
metadata:
  name: order-service
  namespace: amazon
spec:
  replicas: 1
  selector:
    matchLabels:
      app: order-service
  template:
    metadata:
      labels:
        app: order-service
    spec:
      containers:
        - name: order-service
          image: salvadorkiwi/order-service:latest
          ports:
            - containerPort: 8080
          env:
            - name: SPRING_DATASOURCE_URL
              value: jdbc:postgresql://order-postgres:5432/amazondb-orders
            - name: SPRING_DATASOURCE_USERNAME
              valueFrom:
                secretKeyRef:
                  name: order-postgres-secret
                  key: POSTGRES_USER
            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: order-postgres-secret
                  key: POSTGRES_PASSWORD
          volumeMounts:
            - name: order-service-config
              mountPath: /config
      volumes:
        - name: order-service-config
          configMap:
            name: order-service-configmap
