apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboards
  namespace: monitoring
  labels:
    grafana_dashboard: "1"
data:
  user-dashboard.json: |
    {
      "id": null,
      "title": "User Service Dashboard",
      "tags": ["user-service"],
      "timezone": "browser",
      "schemaVersion": 36,
      "version": 1,
      "panels": [
        {
          "id": 1,
          "title": "Request Rate",
          "type": "timeseries",
          "datasource": "Prometheus",
          "targets": [
            {
              "expr": "rate(http_server_requests_seconds_count{job=\"user-service\"}[1m])",
              "legendFormat": "requests/sec"
            }
          ],
          "gridPos": { "x": 0, "y": 0, "w": 8, "h": 8 }
        },
        {
          "id": 2,
          "title": "Error Rate",
          "type": "timeseries",
          "datasource": "Prometheus",
          "targets": [
            {
              "expr": "rate(http_server_requests_seconds_count{job=\"user-service\",status!~\"2..\"}[1m])",
              "legendFormat": "errors/sec"
            }
          ],
          "gridPos": { "x": 8, "y": 0, "w": 8, "h": 8 }
        },
        {
          "id": 4,
          "title": "Error Logs",
          "type": "logs",
          "datasource": "Loki",
          "targets": [
            {
              "expr": "{job=\"user-service\"} |= \"ERROR\"",
              "legendFormat": ""
            }
          ],
          "gridPos": { "x": 0, "y": 8, "w": 24, "h": 8 }
        }
      ]
    }
  product-dashboard.json: |
    {
      "id": null,
      "title": "Product Service Dashboard",
      "tags": ["product-service"],
      "timezone": "browser",
      "schemaVersion": 36,
      "version": 1,
      "panels": [
        {
          "id": 1,
          "title": "HTTP Request Rate",
          "type": "timeseries",
          "datasource": "Prometheus",
          "targets": [
            {
              "expr": "sum(rate(http_server_requests_seconds_count{job=\"product-service\"}[1m])) by (uri)",
              "refId": "A"
            }
          ],
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 0 }
        },
        {
          "id": 2,
          "title": "Error Rate",
          "type": "timeseries",
          "datasource": "Loki",
          "targets": [
            {
              "expr": "sum(rate({app=\"amazon\", service=\"product-service\", level=\"ERROR\"}[1m]))",
              "refId": "A"
            }
          ],
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 0 }
        },
        {
          "id": 3,
          "title": "RabbitMQ Event Audit",
          "type": "logs",
          "datasource": "Loki",
          "targets": [
            {
              "expr": "{app=\"amazon\", service=\"product-service\"} | json | routingKey != \"\"",
              "refId": "A"
            }
          ],
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 8 }
        },
        {
          "id": 4,
          "title": "Feign Call Outcomes",
          "type": "logs",
          "datasource": "Loki",
          "targets": [
            {
              "expr": "{app=\"amazon\", service=\"product-service\"} |= \"Feign call\"",
              "refId": "A"
            }
          ],
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 8 }
        },
        {
          "id": 5,
          "title": "JVM Health (Heap Used)",
          "type": "timeseries",
          "datasource": "Prometheus",
          "targets": [
            {
              "expr": "jvm_memory_used_bytes{job=\"product-service\", area=\"heap\"}",
              "refId": "A"
            }
          ],
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 16 }
        },
        {
          "id": 6,
          "title": "DB Connections",
          "type": "timeseries",
          "datasource": "Prometheus",
          "targets": [
            {
              "expr": "hikaricp_connections_active{job=\"product-service\"}",
              "refId": "A"
            }
          ],
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 16 }
        }
      ]
    }
  order-dashboard.json: |
    {
      "id": null,
      "title": "Order Service Dashboard",
      "tags": ["order-service"],
      "timezone": "browser",
      "schemaVersion": 36,
      "version": 1,
      "panels": [
        {
          "title": "Request Rate",
          "type": "timeseries",
          "datasource": "Prometheus",
          "targets": [
            {
              "expr": "rate(http_server_requests_seconds_count{job=\"order-service\"}[1m])",
              "legendFormat": "requests/sec"
            }
          ],
          "gridPos": { "x": 0, "y": 0, "w": 12, "h": 8 }
        },
        {
          "title": "Error Rate",
          "type": "timeseries",
          "datasource": "Prometheus",
          "targets": [
            {
              "expr": "rate(http_server_requests_seconds_count{job=\"order-service\",status!~\"2..\"}[1m])",
              "legendFormat": "errors/sec"
            }
          ],
          "gridPos": { "x": 12, "y": 0, "w": 12, "h": 8 }
        }
      ]
    }
  shipping-dashboard.json: |
    {
      "id": null,
      "title": "Shipping Service Dashboard",
      "tags": ["shipping-service"],
      "timezone": "browser",
      "schemaVersion": 38,
      "version": 1,
      "panels": [
        {
          "datasource": "Prometheus",
          "title": "Shipping Request Rate",
          "type": "timeseries",
          "targets": [
            {
              "expr": "sum(rate(http_server_requests_seconds_count{job=\"shipping-service\"}[5m])) by (uri)",
              "refId": "A"
            }
          ],
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 0 }
        }
      ]
    }
  billing-dashboard.json: |
    {
      "id": null,
      "title": "Billing Service Dashboard",
      "tags": ["billing-service"],
      "timezone": "browser",
      "schemaVersion": 36,
      "version": 1,
      "panels": [
        {
          "title": "HTTP Request Rate",
          "type": "timeseries",
          "datasource": "Prometheus",
          "targets": [
            {
              "expr": "rate(http_server_requests_seconds_count{job=\"billing-service\"}[5m])",
              "legendFormat": "{{uri}} - {{status}}"
            }
          ],
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 0 }
        }
      ]
    }
