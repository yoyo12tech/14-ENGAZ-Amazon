apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboards
  namespace: monitoring
  labels:
    grafana_dashboard: "1"
data:
  user-dashboard.json: |
    {
      "annotations": {
        "list": [
          {
            "builtIn": 1,
            "datasource": {
              "type": "grafana",
              "uid": "-- Grafana --"
            },
            "enable": true,
            "hide": true,
            "iconColor": "rgba(0, 211, 255, 1)",
            "name": "Annotations & Alerts",
            "target": {
              "limit": 100,
              "matchAny": false,
              "tags": [],
              "type": "dashboard"
            },
            "type": "dashboard"
          }
        ]
      },
      "editable": true,
      "fiscalYearStartMonth": 0,
      "graphTooltip": 0,
      "id": null,
      "links": [],
      "liveNow": false,
      "panels": [
        {
          "id": 101,
          "title": "Request Rate (Prometheus)",
          "type": "timeseries",
          "datasource": "Prometheus",
          "targets": [
            {
              "expr": "rate(http_server_requests_seconds_count{job=\"user-service\"}[1m])",
              "legendFormat": "requests/sec"
            }
          ],
          "gridPos": { "x": 0, "y": 0, "w": 8, "h": 8 }
        },
        {
          "id": 102,
          "title": "Error Rate (Prometheus)",
          "type": "timeseries",
          "datasource": "Prometheus",
          "targets": [
            {
              "expr": "rate(http_server_requests_seconds_count{job=\"user-service\",status!~\"2..\"}[1m])",
              "legendFormat": "errors/sec"
            }
          ],
          "gridPos": { "x": 8, "y": 0, "w": 8, "h": 8 }
        },
        {
          "id": 103,
          "title": "Average Response Latency (Prometheus)",
          "type": "timeseries",
          "datasource": "Prometheus",
          "targets": [
            {
              "expr": "rate(http_server_requests_seconds_sum{job=\"user-service\"}[1m]) / rate(http_server_requests_seconds_count{job=\"user-service\"}[1m])",
              "legendFormat": "avg latency (s)"
            }
          ],
          "gridPos": { "x": 16, "y": 0, "w": 8, "h": 8 }
        },
        {
          "id": 1,
          "datasource": { "type": "loki", "uid": "loki" },
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 8 },
          "options": {
            "dedupStrategy": "none",
            "enableLogDetails": true,
            "prettifyLogMessage": false,
            "showCommonLabels": false,
            "showLabels": false,
            "showTime": true,
            "sortOrder": "Descending",
            "wrapLogMessage": false
          },
          "targets": [
            {
              "datasource": { "type": "loki", "uid": "loki" },
              "editorMode": "code",
              "expr": "{app=\"amazon\", service=\"user-service\"}",
              "queryType": "range",
              "refId": "A"
            }
          ],
          "title": "User Service Logs (Loki)",
          "type": "logs"
        },
        {
          "id": 2,
          "datasource": { "type": "loki", "uid": "loki" },
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 8 },
          "options": {
            "legend": { "displayMode": "list", "placement": "bottom", "showLegend": true },
            "tooltip": { "mode": "single", "sort": "none" }
          },
          "targets": [
            {
              "datasource": { "type": "loki", "uid": "loki" },
              "editorMode": "code",
              "expr": "count_over_time({app=\"amazon\", service=\"user-service\", level=\"ERROR\"}[1m])",
              "queryType": "range",
              "refId": "A"
            }
          ],
          "title": "Error Rate (Loki per min)",
          "type": "timeseries"
        },
        {
          "id": 3,
          "datasource": { "type": "loki", "uid": "loki" },
          "gridPos": { "h": 8, "w": 24, "x": 0, "y": 16 },
          "options": {
            "legend": { "displayMode": "list", "placement": "bottom", "showLegend": true },
            "tooltip": { "mode": "single", "sort": "none" }
          },
          "targets": [
            {
              "datasource": { "type": "loki", "uid": "loki" },
              "editorMode": "code",
              "expr": "count_over_time({app=\"amazon\", service=\"user-service\"} |= \"deactivate\" [5m])",
              "queryType": "range",
              "refId": "A"
            }
          ],
          "title": "User Deactivations (last 5m)",
          "type": "timeseries"
        },
        {
          "id": 105,
          "title": "Auth Logs (Loki)",
          "type": "logs",
          "datasource": "Loki",
          "targets": [
            {
              "expr": "{job=\"user-service\"} |~ \"auth|login|register|token\"",
              "legendFormat": ""
            }
          ],
          "gridPos": { "x": 0, "y": 24, "w": 24, "h": 8 }
        },
        {
          "id": 106,
          "title": "Log Volume Over Time (Loki)",
          "type": "timeseries",
          "datasource": "Loki",
          "targets": [
            {
              "expr": "sum(rate({job=\"user-service\"}[1m]))",
              "legendFormat": "log lines/sec"
            }
          ],
          "gridPos": { "x": 0, "y": 32, "w": 24, "h": 8 }
        }
      ],
      "refresh": "5s",
      "schemaVersion": 38,
      "style": "dark",
      "tags": ["amazon", "user-service"],
      "templating": { "list": [] },
      "time": { "from": "now-1h", "to": "now" },
      "timepicker": {},
      "timezone": "browser",
      "title": "User Service Dashboard",
      "uid": "user-service-dashboard",
      "version": 1,
      "weekStart": ""
    }
