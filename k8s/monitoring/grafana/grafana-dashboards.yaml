              }
            ],
            "gridPos": {
              "h": 8,
              "w": 24,
              "x": 0,
              "y": 8
            }
          }
        ],
        "schemaVersion": 38,
        "style": "dark",
        "tags": [
          "shipping-service"
        ],
        "templating": {
          "list": []
        },
        "time": {
          "from": "now-30m",
          "to": "now"
        },
        "timezone": "browser",
        "title": "Shipping Service Dashboard",
        "version": 1
      }
  billing-dashboard.json: |
    {
      "id": null,
