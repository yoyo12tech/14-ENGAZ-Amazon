apiVersion: v1
kind: ConfigMap
metadata:
  name: shipping-service-configmap
  namespace: amazon
data:
  SPRING_DATASOURCE_URL: jdbc:postgresql://shipping-postgres:5432/amazondb-shipments
  SPRING_DATASOURCE_USERNAME: postgres
  SPRING_DATA_MONGODB_URI: mongodb://root:rootpass@mongo:27017/amazonmongo?authSource=admin
  SPRING_CASSANDRA_CONTACT_POINTS: cassandra
  SPRING_CASSANDRA_PORT: "9042"
  SPRING_CASSANDRA_LOCAL_DATACENTER: datacenter1
  SPRING_CASSANDRA_KEYSPACE_NAME: amazonks
  SPRING_DATA_REDIS_HOST: redis
  SPRING_DATA_REDIS_PORT: "6379"
  SPRING_DATA_REDIS_PASSWORD: redispass
  SPRING_RABBITMQ_HOST: rabbitmq
  FEIGN_ORDER_SERVICE_URL: http://order-service:8080
  FEIGN_PRODUCT_SERVICE_URL: http://product-service:8080
