apiVersion: v1
kind: ConfigMap
metadata:
  name: shipping-service-configmap
  namespace: amazon
data:
  SPRING_DATASOURCE_URL: jdbc:postgresql://shipping-postgres:5432/amazondb-shipments
  SPRING_DATASOURCE_USERNAME: postgres
  SPRING_JPA_HIBERNATE_DDL_AUTO: update
  SPRING_DATA_MONGODB_URI: mongodb://root:rootpass@mongo:27017/amazonmongo?authSource=admin
  SPRING_MONGODB_URI: mongodb://root:rootpass@mongo:27017/amazonmongo?authSource=admin
  SPRING_DATA_REDIS_HOST: redis
  SPRING_DATA_REDIS_PORT: "6379"
  SPRING_DATA_REDIS_PASSWORD: redispass
  SPRING_RABBITMQ_HOST: rabbitmq
  SPRING_CASSANDRA_CONTACT_POINTS: cassandra
  FEIGN_ORDER_SERVICE_URL: http://order-service:8080
  LOKI_URL: http://loki.monitoring.svc.cluster.local:3100
  MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE: prometheus,health,info
  MANAGEMENT_ENDPOINT_PROMETHEUS_ACCESS: unrestricted
  