apiVersion: v1
kind: ConfigMap
metadata:
  name: order-service-configmap
  namespace: amazon
data:
  application.properties: |
    # Postgres
    spring.datasource.url=jdbc:postgresql://order-postgres-svc:5432/orders
    spring.datasource.username=postgres
    spring.datasource.password=postgres
    spring.jpa.hibernate.ddl-auto=update
    spring.jpa.show-sql=true

    # MongoDB
    spring.data.mongodb.uri=mongodb://mongo:27017/amazonmongo

    # Neo4j
    spring.neo4j.uri=bolt://neo4j-svc:7687
    spring.neo4j.authentication.username=neo4j
    spring.neo4j.authentication.password=neo4jpass

    # Redis
    spring.redis.host=redis-svc
    spring.redis.port=6379
    spring.redis.password=redispass
