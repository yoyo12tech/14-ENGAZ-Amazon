apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-configmap
  namespace: monitoring

data:
  prometheus.yml: |
    global:
      scrape_interval: 15s

    scrape_configs:

      - job_name: 'shipping-service'

        metrics_path: '/actuator/prometheus'

        static_configs:
          - targets:
              - 'shipping-service.amazon.svc.cluster.local:8080'