apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: cassandra
  namespace: amazon
spec:
  serviceName: cassandra
  replicas: 1

  selector:
    matchLabels:
      app: cassandra

  template:
    metadata:
      labels:
        app: cassandra
    spec:
      containers:
        - name: cassandra
          image: cassandra:5
          ports:
            - containerPort: 9042

          env:
            - name: CASSANDRA_CLUSTER_NAME
              value: amazon-cluster

            - name: MAX_HEAP_SIZE
              value: 256M

            - name: HEAP_NEWSIZE
              value: 128M

          volumeMounts:
            - name: cassandra-storage
              mountPath: /var/lib/cassandra

  volumeClaimTemplates:
    - metadata:
        name: cassandra-storage
      spec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 2Gi