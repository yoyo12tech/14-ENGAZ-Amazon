apiVersion: apps/v1
kind: StatefulSet

metadata:
  name: rabbitmq
  namespace: amazon
spec:
  serviceName: rabbitmq
  replicas: 1

  selector:
    matchLabels:
      app: rabbitmq

template:
  spec:
    containers:
      - name: rabbitmq
        image: rabbitmq:3-management
        ports:
          - containerPort: 5672
          - containerPort: 15672
        volumeMounts:             # ← missing entirely
          - name: rabbitmq-data
            mountPath: /var/lib/rabbitmq
    volumes:
      - name: rabbitmq-data
        persistentVolumeClaim:
          claimName: rabbitmq-pvc
