spring:
  application:
    name: shipping-service

  datasource:
    url: jdbc:postgresql://shipping-postgres:5432/amazondb-shipments
    username: postgres
    password: postgres

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  data:
    mongodb:
      uri: ${SPRING_MONGODB_URI:${SPRING_DATA_MONGODB_URI:mongodb://root:rootpass@mongo:27017/amazonmongo?authSource=admin}}
    redis:
      host: redis
      port: 6379
      password: redispass

  cassandra:
    contact-points: cassandra
    port: 9042
    local-datacenter: datacenter1
    keyspace-name: amazonks
    schema-action: CREATE_IF_NOT_EXISTS
    request:
      timeout: 10s
    connection:
      init-query-timeout: 10s

  cache:
    type: redis

  rabbitmq:
    host: rabbitmq
    port: 5672
    username: guest
    password: guest
    listener:
      simple:
        acknowledge-mode: auto
        default-requeue-rejected: false
        retry:
          enabled: true
          initial-interval: 1000
          max-attempts: 3

feign:
  user-service:
    url: http://user-service:8080
  product-service:
    url: http://product-service:8080
  order-service:
    url: http://order-service:8080
  shipping-service:
    url: http://shipping-service:8080
  billing-service:
    url: http://billing-service:8080

jwt:
  secret: "bXlTdXBlclNlY3JldEtleUZvckpXVEF1dGhlbnRpY2F0aW9u"
  expiration: 86400000

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always
  health:
    defaults:
      enabled: true