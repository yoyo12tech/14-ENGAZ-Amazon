spring:
  application:
    name: shipping-service

  datasource:
    url: jdbc:postgresql://postgres:5432/amazondb
    username: postgres
    password: postgres

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  data:
    redis:
      host: redis
      port: 6379
      password: redispass

  cassandra:
    contact-points: cassandra
    port: 9042
    local-datacenter: datacenter1
    keyspace-name: amazonks
    schema-action: CREATE_IF_NOT_EXISTS
    request:
      timeout: 10s
    connection:
      init-query-timeout: 10s

  cache:
    type: redis
  mongodb:
    uri: mongodb://root:rootpass@mongo:27017/amazonmongo?authSource=admin

jwt:
  secret: "bXlTdXBlclNlY3JldEtleUZvckpXVEF1dGhlbnRpY2F0aW9u"
  expiration: 86400000

server:
  port: 8080

management:
  endpoint:
    health:
      show-details: always
  health:
    defaults:
      enabled: false