services:
  user-postgres:
    build:
      context: .
      dockerfile: Dockerfile.db
    container_name: user-postgres
    restart: always
    environment:
      POSTGRES_DB: amazondb-users
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - user-pgdata:/var/lib/postgresql/data
    networks:
      - amazon-network
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres -d amazondb-users" ]
      interval: 10s
      timeout: 5s
      retries: 5

  product-postgres:
    build:
      context: .
      dockerfile: Dockerfile.db
    container_name: product-postgres
    restart: always
    environment:
      POSTGRES_DB: amazondb-products
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5433:5432"
    volumes:
      - product-pgdata:/var/lib/postgresql/data
    networks:
      - amazon-network
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres -d amazondb-products" ]
      interval: 10s
      timeout: 5s
      retries: 5

  order-postgres:
    build:
      context: .
      dockerfile: Dockerfile.db
    container_name: order-postgres
    restart: always
    environment:
      POSTGRES_DB: amazondb-orders
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5434:5432"
    volumes:
      - order-pgdata:/var/lib/postgresql/data
    networks:
      - amazon-network
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres -d amazondb-orders" ]
      interval: 10s
      timeout: 5s
      retries: 5

  shipping-postgres:
    build:
      context: .
      dockerfile: Dockerfile.db
    container_name: shipping-postgres
    restart: always
    environment:
      POSTGRES_DB: amazondb-shipments
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5435:5432"
    volumes:
      - shipping-pgdata:/var/lib/postgresql/data
    networks:
      - amazon-network
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres -d amazondb-shipments" ]
      interval: 10s
      timeout: 5s
      retries: 5

  billing-postgres:
    build:
      context: .
      dockerfile: Dockerfile.db
    container_name: billing-postgres
    restart: always
    environment:
      POSTGRES_DB: amazondb-billing
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5436:5432"
    volumes:
      - billing-pgdata:/var/lib/postgresql/data
    networks:
      - amazon-network
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres -d amazondb-billing" ]
      interval: 10s
      timeout: 5s
      retries: 5

  mongo:
    image: mongo:latest
    container_name: amazon-mongo
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: rootpass
      MONGO_INITDB_DATABASE: amazonmongo
    volumes:
      - mongo-data:/data/db
    networks:
      - amazon-network
    healthcheck:
      test: [ "CMD", "mongosh", "--eval", "db.adminCommand('ping')" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  redis:
    image: redis:latest
    container_name: amazon-redis
    ports:
      - "6379:6379"
    command: redis-server --requirepass redispass --maxmemory 256mb --maxmemory-policy allkeys-lru
    networks:
      - amazon-network
    healthcheck:
      test: [ "CMD", "redis-cli", "-a", "redispass", "ping" ]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

  elasticsearch:
    image: elasticsearch:9.0.3
    container_name: amazon-elasticsearch
    ports:
      - "9200:9200"
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - ES_JAVA_OPTS=-Xms256m -Xmx256m
    volumes:
      - es-data:/usr/share/elasticsearch/data
    networks:
      - amazon-network
    healthcheck:
      test: [ "CMD-SHELL", "curl -f http://localhost:9200/_cluster/health || exit 1" ]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 60s

  neo4j:
    image: neo4j:latest
    container_name: amazon-neo4j
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      NEO4J_AUTH: neo4j/neo4jpass
      NEO4J_server_memory_heap_max__size: 256m
      NEO4J_server_memory_heap_initial__size: 128m
      NEO4J_server_memory_pagecache_size: 128m
    volumes:
      - neo4j-data:/data
    networks:
      - amazon-network
    healthcheck:
      test: [ "CMD", "neo4j", "status" ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  cassandra:
    image: cassandra:latest
    container_name: amazon-cassandra
    ports:
      - "9042:9042"
    environment:
      - CASSANDRA_CLUSTER_NAME=amazoncluster
      - CASSANDRA_DC=datacenter1
      - CASSANDRA_KEYSPACE=amazonks
      - MAX_HEAP_SIZE=512M
      - HEAP_NEWSIZE=128M
      - JVM_OPTS=-Dcassandra.skip_wait_for_gossip_to_settle=0 -Dcassandra.ring_delay_ms=1000 -Dcassandra.write_request_timeout_in_ms=30000
    volumes:
      - cassandra-data:/var/lib/cassandra
    networks:
      - amazon-network
    healthcheck:
      test: [ "CMD-SHELL", "cqlsh -e 'DESCRIBE KEYSPACES'" ]
      interval: 20s
      timeout: 15s
      retries: 10
      start_period: 90s

  rabbitmq:
    image: rabbitmq:4.0-management
    container_name: amazon-rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    networks:
      - amazon-network
    healthcheck:
      test: [ "CMD", "rabbitmq-diagnostics", "check_running" ]
      interval: 10s
      timeout: 5s
      retries: 5

  # User Service
  user-service:
    build:
      context: ./user-service
      dockerfile: Dockerfile
    container_name: user-service
    ports:
      - "8081:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://user-postgres:5432/amazondb-users
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
      SPRING_DATA_MONGODB_URI: mongodb://root:rootpass@mongo:27017/amazonmongo?authSource=admin
      SPRING_MONGODB_URI: mongodb://root:rootpass@mongo:27017/amazonmongo?authSource=admin
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      SPRING_DATA_REDIS_PASSWORD: redispass
      SPRING_RABBITMQ_HOST: rabbitmq
    depends_on:
      user-postgres:
        condition: service_healthy
      mongo:
        condition: service_healthy
      redis:
        condition: service_started
      rabbitmq:
        condition: service_healthy
    networks:
      - amazon-network
    restart: on-failure
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/api/users/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 8
      start_period: 30s

  # Product Service
  product-service:
    build:
      context: ./product-service
      dockerfile: Dockerfile
    container_name: product-service
    ports:
      - "8082:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://product-postgres:5432/amazondb-products
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
      SPRING_MONGODB_URI: mongodb://root:rootpass@mongo:27017/amazonmongo?authSource=admin
      SPRING_DATA_MONGODB_URI: mongodb://root:rootpass@mongo:27017/amazonmongo?authSource=admin
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      SPRING_DATA_REDIS_PASSWORD: redispass
      SPRING_RABBITMQ_HOST: rabbitmq
    depends_on:
      product-postgres:
        condition: service_healthy
      mongo:
        condition: service_healthy
      redis:
        condition: service_started
      elasticsearch:
        condition: service_started
      rabbitmq:
        condition: service_healthy
    networks:
      - amazon-network
    restart: on-failure
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/api/products/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 8
      start_period: 30s

  # Order Service
  order-service:
    build:
      context: ./order-service
      dockerfile: Dockerfile
    container_name: order-service
    ports:
      - "8083:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://order-postgres:5432/amazondb-orders
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
      SPRING_DATA_MONGODB_URI: mongodb://root:rootpass@mongo:27017/amazonmongo?authSource=admin
      SPRING_MONGODB_URI: mongodb://root:rootpass@mongo:27017/amazonmongo?authSource=admin
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      SPRING_DATA_REDIS_PASSWORD: redispass
      SPRING_NEO4J_URI: bolt://neo4j:7687
      SPRING_NEO4J_AUTHENTICATION_USERNAME: neo4j
      SPRING_NEO4J_AUTHENTICATION_PASSWORD: neo4jpass
      SPRING_RABBITMQ_HOST: rabbitmq
    depends_on:
      order-postgres:
        condition: service_healthy
      mongo:
        condition: service_healthy
      redis:
        condition: service_started
      neo4j:
        condition: service_started
      rabbitmq:
        condition: service_healthy
    networks:
      - amazon-network
    restart: on-failure
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/api/orders/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 8
      start_period: 30s

  # Shipping Service
  shipping-service:
    build:
      context: ./shipping-service
      dockerfile: Dockerfile
    container_name: shipping-service
    ports:
      - "8084:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://shipping-postgres:5432/amazondb-shipments
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
      SPRING_DATA_MONGODB_URI: mongodb://root:rootpass@mongo:27017/amazonmongo?authSource=admin
      SPRING_MONGODB_URI: mongodb://root:rootpass@mongo:27017/amazonmongo?authSource=admin
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      SPRING_DATA_REDIS_PASSWORD: redispass
      SPRING_RABBITMQ_HOST: rabbitmq
    depends_on:
      shipping-postgres:
        condition: service_healthy
      mongo:
        condition: service_healthy
      redis:
        condition: service_started
      cassandra:
        condition: service_started
      rabbitmq:
        condition: service_healthy
    networks:
      - amazon-network
    restart: on-failure
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/api/shipments/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 8
      start_period: 30s

  # Billing Service
  billing-service:
    build:
      context: ./billing-service
      dockerfile: Dockerfile
    container_name: billing-service
    ports:
      - "8085:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://billing-postgres:5432/amazondb-billing
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
      SPRING_DATA_MONGODB_URI: mongodb://root:rootpass@mongo:27017/amazonmongo?authSource=admin
      SPRING_MONGODB_URI: mongodb://root:rootpass@mongo:27017/amazonmongo?authSource=admin
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      SPRING_DATA_REDIS_PASSWORD: redispass
      SPRING_RABBITMQ_HOST: rabbitmq
    depends_on:
      billing-postgres:
        condition: service_healthy
      mongo:
        condition: service_healthy
      redis:
        condition: service_started
      rabbitmq:
        condition: service_healthy
    networks:
      - amazon-network
    restart: on-failure
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/api/transactions/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 8
      start_period: 30s
volumes:
  user-pgdata:
  product-pgdata:
  order-pgdata:
  shipping-pgdata:
  billing-pgdata:
  mongo-data:
  es-data:
  neo4j-data:
  cassandra-data:
networks:
  amazon-network:
    name: amazon-network
    driver: bridge
