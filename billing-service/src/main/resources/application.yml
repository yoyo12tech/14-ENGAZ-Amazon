jwt:
  secret: "bXlTdXBlclNlY3JldEtleUZvckpXVEF1dGhlbnRpY2F0aW9u"
  expiration: 86400000

spring:
  application:
    name: billing-service

  datasource:
    url: jdbc:postgresql://billing-postgres:5432/amazondb-billing
    username: postgres
    password: postgres

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  data:
    mongodb:
      uri: mongodb://root:rootpass@mongo:27017/amazonmongo?authSource=admin

    redis:
      host: redis
      port: 6379
      password: redispass

  cache:
    type: redis

  rabbitmq:
    host: rabbitmq
    port: 5672
    username: guest
    password: guest
    listener:
      simple:
        acknowledge-mode: auto
        default-requeue-rejected: false
        retry:
          enabled: true
          initial-interval: 1000
          max-attempts: 3

feign:
  user-service:
    url: http://user-service:8080
  product-service:
    url: http://product-service:8080
  order-service:
    url: http://order-service:8080
  shipping-service:
    url: http://shipping-service:8080
  billing-service:
    url: http://billing-service:8080

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always
  health:
    defaults:
      enabled: true