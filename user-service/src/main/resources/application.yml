spring:
  application:
    name: user-service

  datasource:
    url: jdbc:postgresql://localhost:5432/amazondb   # Changed: 'postgres' -> 'localhost' (IntelliJ runs outside Docker)
    username: postgres
    password: postgres

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  data:
    redis:
      host: localhost   # Changed: 'redis' -> 'localhost'
      port: 6379
      password: redispass

  cache:
    type: redis
  mongodb:
    uri: mongodb://root:rootpass@localhost:27017/amazonmongo?authSource=admin

jwt:
  secret: "bXlTdXBlclNlY3JldEtleUZvckpXVEF1dGhlbnRpY2F0aW9u"
  expiration: 86400000

server:
  port: 8080

management:
  endpoint:
    health:
      show-details: always
  health:
    defaults:
      enabled: false