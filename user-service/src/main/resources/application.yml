spring:
  application:
    name: user-service

  datasource:
    url: jdbc:postgresql://user-postgres:5432/amazondb-users
    username: postgres
    password: postgres

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  data:
    redis:
      host: redis
      port: 6379
      password: redispass

  cache:
    type: redis

  rabbitmq:
    host: rabbitmq
    port: 5672
    username: guest
    password: guest
    listener:
      simple:
        acknowledge-mode: auto
        default-requeue-rejected: false
        retry:
          enabled: true
          initial-interval: 1000
          max-retries: 3
  mongodb:
    uri: mongodb://root:rootpass@mongo:27017/amazonmongo?authSource=admin

feign:
  user-service:
    url: http://user-service:8080
  product-service:
    url: http://product-service:8080
  order-service:
    url: http://order-service:8080
  shipping-service:
    url: http://shipping-service:8080
  billing-service:
    url: http://billing-service:8080

jwt:
  secret: "bXlTdXBlclNlY3JldEtleUZvckpXVEF1dGhlbnRpY2F0aW9u"
  expiration: 86400000

server:
  port: 8080

# ── Actuator + Prometheus ──────────────────────────────────────────────────────
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      show-details: always
    prometheus:
      enabled: true
  metrics:
    tags:
      application: user-service        # label on every Prometheus metric
  health:
    defaults:
      enabled: true
  prometheus:
    metrics:
      export:
        enabled: true